name: Integration

on:
  pull_request:

jobs:
  integrate:
    runs-on: ubuntu-latest

    steps:
      
      - name: Download Model
        run: |
          python scripts/download_model.py
        env:
          AZURE_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
          AZURE_CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
          AZURE_CLIENT_SECRET: ${{secrets.AZURE_CLIENT_SECRET}}
